<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171717" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Media Library" />
    <title>Media Library</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/assets/pwa-icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/assets/pwa-icon-180.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/src/startup.css" />
  </head>
  <body data-app-state="starting">
    <main id="startupFallback" aria-labelledby="startupTitle" aria-busy="true">
      <section class="startup-card">
        <div class="startup-loading" role="status" aria-label="Connecting to Media Library">
          <span class="startup-spinner" aria-hidden="true"></span>
        </div>
        <span class="startup-symbol" aria-hidden="true">
          <svg class="lucide lucide-eye-closed" xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 18-.722-3.25" />
            <path d="M2 8a10.645 10.645 0 0 0 20 0" />
            <path d="m20 15-1.726-2.05" />
            <path d="m4 15 1.726-2.05" />
            <path d="m9 18 .722-3.25" />
          </svg>
        </span>
        <h1 id="startupTitle">Connecting to Media Library</h1>
        <p id="startupMessage" role="status">If the library does not open, start Media Preview Server in Eagle and check that this device is connected to the same network.</p>
        <a class="startup-retry" href="">Retry</a>
      </section>
    </main>
    <div id="root"></div>
    <script src="/bootstrap.js" defer></script>
    <script src="/src/main.tsx" type="module"></script>
  </body>
</html>
