<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Media Preview Server</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="window-shell">
      <header class="titlebar">
        <div class="brand">
          <img id="windowIcon" class="brand-icon" src="./assets/icon_off.svg" alt="" aria-hidden="true" />
          <h1>Media Preview Server</h1>
        </div>
        <button id="closeWindowButton" class="window-close" type="button" aria-label="Close" title="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6l12 12M18 6 6 18" />
          </svg>
        </button>
      </header>

      <section class="status-panel">
        <div class="status-head">
          <div class="section-heading">
            <span class="section-heading-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></svg>
            </span>
            <h2>Server Status</h2>
          </div>
          <div class="status-controls">
            <span id="statusBadge" class="status-pill stopped">
              <span></span>
              <strong>Stopped</strong>
            </span>
            <label class="power-switch" aria-label="Start or stop server">
              <input id="serverPowerInput" type="checkbox" />
              <span></span>
            </label>
          </div>
        </div>

        <div class="status-divider"></div>

        <div class="access-grid">
          <div class="access-main">
            <label class="field-caption" for="accessUrl">Endpoint URL</label>
            <div class="endpoint-row">
              <input id="accessUrl" class="endpoint-input" type="text" readonly />
              <button id="copyUrlButton" class="copy-button" type="button" aria-label="Copy endpoint URL" title="Copy endpoint URL">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="10" height="10" rx="2" /><rect x="5" y="5" width="10" height="10" rx="2" /></svg>
              </button>
            </div>

            <div class="option-list">
              <label class="option-row">
                <input id="autoStartInput" type="checkbox" />
                <span class="option-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><path d="M12 2v10" /><path d="M18.4 6.6a9 9 0 1 1-12.8 0" /></svg>
                </span>
                <span>
                  <strong>Auto start</strong>
                  <small>Start server automatically when app launches.</small>
                </span>
              </label>

              <label class="option-row">
                <input id="authEnabledInput" type="checkbox" />
                <span class="option-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.4-2.8 8.3-7 10-4.2-1.7-7-5.6-7-10V6l7-3z" /><path d="m9.5 12 1.8 1.8 3.5-4" /></svg>
                </span>
                <span>
                  <strong>BasicAuth protection</strong>
                  <small>Require username &amp; password to access.</small>
                </span>
              </label>

              <label class="option-row">
                <input id="publicNetworkInput" type="checkbox" />
                <span class="option-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M3 12h18M12 3c2.6 2.7 3.9 5.7 3.9 9S14.6 18.3 12 21M12 3c-2.6 2.7-3.9 5.7-3.9 9s1.3 6.3 3.9 9" /></svg>
                </span>
                <span>
                  <strong>Public Network</strong>
                  <small>Allow access from other devices on the network.</small>
                </span>
              </label>
            </div>
          </div>

          <aside class="qr-panel">
            <span>Quick Access (QR)</span>
            <div id="qrCode" class="qr-code" aria-label="QR code"></div>
          </aside>
        </div>
      </section>

      <form id="settingsForm" class="settings-panel">
        <div class="section-title">
          <div class="section-heading">
            <span class="section-heading-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>
            </span>
            <h2>Settings</h2>
          </div>
        </div>

        <div id="settingsBody" class="settings-body">
          <label class="setting-row">
            <span>Port</span>
            <span class="setting-control">
              <input id="portInput" type="number" min="1" max="65535" />
              <small>The port the server listens on.</small>
            </span>
          </label>

          <label class="setting-row">
            <span>User</span>
            <span class="setting-control">
              <input id="userInput" type="text" autocomplete="username" />
              <small>BasicAuth username.</small>
            </span>
          </label>

          <label class="setting-row">
            <span>Password</span>
            <span class="setting-control password-wrap">
              <input id="passwordInput" type="password" autocomplete="new-password" />
              <button id="togglePasswordButton" type="button" aria-label="Show password" title="Show password">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M3 3l18 18" />
                  <path d="M10.6 5.2A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a18.3 18.3 0 0 1-3.2 4.1" />
                  <path d="M6.7 6.7C4.1 8.4 2 12 2 12s3.5 7 10 7c1.9 0 3.5-.4 4.9-1" />
                  <path d="M9.9 9.9A3 3 0 0 0 14.1 14.1" />
                </svg>
              </button>
              <small>BasicAuth password.</small>
            </span>
          </label>
        </div>

        <input id="hostInput" type="hidden" />
        <select id="lanAddressInput" hidden></select>
        <input id="confirmPasswordInput" type="hidden" />
        <button id="saveSettingsButton" type="submit" hidden>Save settings</button>
      </form>
      <p id="message" class="bottom-message" aria-live="polite" hidden></p>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
